<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore | MaidenWins</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f8f5ef;
--text:#1f2937;
--muted:#6b7280;
--accent:#b89258;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,sans-serif;
background:
radial-gradient(circle at top left,rgba(184,146,88,.08),transparent 35%),
radial-gradient(circle at bottom right,rgba(184,146,88,.06),transparent 30%),
var(--bg);
color:var(--text);
}
header{
position:sticky;top:0;z-index:10;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
height:50px;
padding:0 5%;
background:rgba(248,245,239,.78);
backdrop-filter:blur(18px);
}
header::before{
content:"";
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:min(320px,45%);
height:1px;
background:linear-gradient(to right,transparent,rgba(184,146,88,.45),rgba(184,146,88,.9),rgba(184,146,88,.45),transparent);
}

.nav-left,
.nav-right {
      display: flex;
      align-items: center;
    }

header a{
text-decoration:none;
color:#4b5563;
position:relative;
}
.logo{text-align:center}
.logo a{
font-family:"Playfair Display",serif;
font-size:1.65rem;
font-weight:600;
color:#111827;
}
.logo a:after{display:none}
section.hero{
padding:90px 24px 70px;
text-align:center;
max-width:900px;
margin:auto;
}
.title{
font-family:"Playfair Display",serif;
font-size:clamp(2.8rem,6vw,4.5rem);
margin-bottom:18px;
}
.divider{
width:90px;height:2px;
margin:0 auto 30px;
background:linear-gradient(to right,transparent,var(--accent),transparent);
}
.description{
color:var(--muted);
font-size:1.1rem;
line-height:1.9;
max-width:720px;
margin:auto;
}
.coming{
margin-top:35px;
color:var(--accent);
letter-spacing:.18em;
text-transform:uppercase;
font-size:.78rem;
}
.catalog{
max-width:1200px;
margin:auto;
padding:10px 24px 80px;
}
.filters{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:40px;
}
.filter{
display:flex;
flex-direction:column;
gap:8px;
}
label{
font-family:"Playfair Display",serif;
font-size:.95rem;
}
select{
padding:12px 16px;
border:1px solid rgba(184,146,88,.4);
background:#fffdf9;
border-radius:12px;
font-family:Inter,sans-serif;
min-width:220px;
}
.card{
display:flex;
gap:24px;
align-items:center;
background:rgba(255,255,255,.65);
backdrop-filter:blur(10px);
border:1px solid rgba(184,146,88,.15);
border-radius:20px;
padding:20px;
margin-bottom:24px;
transition:.3s;
}
.card:hover{
transform:translateY(-4px);
box-shadow:0 18px 40px rgba(0,0,0,.08);
}
.card img{
width:300px;
height:200px;
object-fit:cover;
border-radius:16px;
transition:.4s;
}
.card:hover img{transform:scale(1.04)}
.info{flex:1}
.info h2{
font-family:"Playfair Display",serif;
margin-bottom:6px;
}
.country{
color:var(--accent);
margin-bottom:16px;
}
.info p{
color:var(--muted);
line-height:1.8;
margin-bottom:18px;
}
.tags{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.tags span{
padding:6px 12px;
border:1px solid rgba(184,146,88,.35);
border-radius:50px;
font-size:.82rem;
color:#6b7280;
}
.price{
width:180px;
text-align:right;
}
.price small{
display:block;
color:#888;
margin-bottom:6px;
}
.amount{
font-family:"Playfair Display",serif;
font-size:2rem;
margin-bottom:18px;
}
.btn{
text-decoration:none;
color:var(--accent);
font-weight:600;
}
footer{
text-align:center;
padding:25px;
border-top:1px solid rgba(0,0,0,.06);
color:#9ca3af;
font-size:.8rem;
}
@media(max-width:900px){
.card{flex-direction:column;align-items:flex-start}
.card img{width:100%;height:240px}
.price{text-align:left;width:auto}
}
</style>
</head>
<body>

  <!-- HEADER -->
  <header>

    <div class="nav-left">
      <a href="explore.html">Explore</a>
    </div>

    <div class="logo">
      <a href="index.html">MaidenWins</a>
    </div>

    <div class="nav-right">
      <a href="contact.html">Contact</a>
    </div>

  </header>

<section class="hero">
<h1 class="title">Explore</h1>
<div class="divider"></div>
<p class="description">
A carefully curated collection of journeys, experiences, and destinations is being prepared. We believe meaningful travel deserves patience, intention, and refinement.
</p>
<div class="coming">Curated Journeys Coming Soon</div>
</section>

<section class="catalog">
<div class="filters">
<div class="filter">
<label>Destination</label>
<select id="destination">
<option>Africa</option>
<option>Asia</option>
</select>
</div>

<div class="filter">
<label>Currency</label>
<select>
<option selected>INR</option>
</select>
</div>
</div>

<div id="cards"></div>
</section>

<footer>© <span id="year"></span> MaidenWins. All rights reserved.</footer>

<script>
const journeys={
Africa:[
{title:"Safari Adventure",country:"Kenya",price:"₹2,45,000",img:"https://images.unsplash.com/photo-1516426122078-c23e76319801?w=900",desc:"Experience luxury safari camps, unforgettable wildlife encounters and breathtaking African sunsets.",tags:["7 Days","Luxury","Wildlife","Private Guide"]},
{title:"Moroccan Escape",country:"Morocco",price:"₹1,95,000",img:"https://images.unsplash.com/photo-1548013146-72479768bada?w=900",desc:"Discover ancient medinas, boutique riads and golden Sahara landscapes in timeless elegance.",tags:["6 Days","Culture","Desert"]}
],
Asia:[
{title:"Bali Retreat",country:"Indonesia",price:"₹1,25,000",img:"https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=900",desc:"Relax among luxury villas, emerald rice terraces and secluded beaches.",tags:["5 Days","Luxury","Beach"]},
{title:"Japan Discovery",country:"Japan",price:"₹2,10,000",img:"https://images.unsplash.com/photo-1492571350019-22de08371fd3?w=900",desc:"Experience timeless traditions, modern cities and breathtaking seasonal landscapes.",tags:["8 Days","Culture","Premium"]}
]
};

function render(){
const dest=document.getElementById("destination").value;
const wrap=document.getElementById("cards");
wrap.innerHTML="";
journeys[dest].forEach(j=>{
wrap.innerHTML+=`
<div class="card">
<img src="${j.img}" alt="">
<div class="info">
<h2>${j.title}</h2>
<div class="country">${j.country}</div>
<p>${j.desc}</p>
<div class="tags">${j.tags.map(t=>`<span>${t}</span>`).join("")}</div>
</div>
<div class="price">
<small>Starting From</small>
<div class="amount">${j.price}</div>
<a href="#" class="btn">View Journey →</a>
</div>
</div>`;
});
}
render();
document.getElementById("destination").addEventListener("change",render);
document.getElementById("year").textContent=new Date().getFullYear();
</script>

</body>
</html>
