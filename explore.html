<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore | MaidenWins</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f8f5ef;
--text-primary:#1f2937;
--text-muted:#6b7280;
--accent:#b89258;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
min-height:100vh;
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,rgba(184,146,88,.08),transparent 35%),
radial-gradient(circle at bottom right,rgba(184,146,88,.06),transparent 30%),
var(--bg);
color:var(--text-primary);
display:flex;
flex-direction:column;
}
header{
position:sticky;
top:0;
z-index:1000;
height:50px;
padding:0 5%;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
background:rgba(248,245,239,.78);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
}
header::before{
content:"";
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(320px,45%);
height:1px;
background:linear-gradient(to right,transparent,rgba(184,146,88,.45),rgba(184,146,88,.85),rgba(184,146,88,.45),transparent);
}
.nav-left,.nav-right{display:flex;align-items:center}
.nav-right{justify-content:flex-end}
header a{
text-decoration:none;
color:#4b5563;
font-size:.95rem;
font-weight:400;
position:relative;
transition:color .3s ease;
}
header a::after{
content:"";
position:absolute;
left:0;
bottom:-7px;
width:0;
height:1.5px;
background:linear-gradient(to right,transparent,var(--accent),transparent);
transition:width .35s ease;
}
header a:hover{color:#111827}
header a:hover::after{width:100%}
.logo{text-align:center}
.logo a{
font-family:'Playfair Display',serif;
font-size:1.65rem;
font-weight:600;
color:#111827;
}
.logo a::after{display:none}

.explore-section{
padding:80px 24px 60px;
text-align:center;
position:relative;
}
.explore-section::before{
content:"";
position:absolute;
width:420px;height:420px;
background:rgba(184,146,88,.08);
border-radius:50%;
filter:blur(90px);
top:20%;
left:50%;
transform:translateX(-50%);
}
.content{position:relative;z-index:1;max-width:760px;margin:auto}
.title{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,6vw,4.5rem);margin-bottom:20px}
.divider{width:90px;height:2px;background:linear-gradient(to right,transparent,var(--accent),transparent);margin:0 auto 32px}
.description{font-size:1.12rem;line-height:1.9;color:var(--text-muted);margin-bottom:36px}

.catalog{max-width:1200px;width:100%;margin:0 auto;padding:20px 24px 70px}
.filters{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:35px}
.filter{display:flex;flex-direction:column;gap:8px}
.filter label{font-family:'Playfair Display',serif}
select{
padding:12px 16px;border-radius:12px;border:1px solid rgba(184,146,88,.35);
background:#fffdf9;font-family:Inter,sans-serif;min-width:220px;color:#444;
}
.card{
display:flex;align-items:center;gap:22px;
background:rgba(255,255,255,.55);
backdrop-filter:blur(10px);
border:1px solid rgba(184,146,88,.15);
border-radius:20px;
padding:20px;
margin-bottom:22px;
transition:.3s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(0,0,0,.08)}
.card img{width:310px;height:200px;object-fit:cover;border-radius:16px;transition:.4s}
.card:hover img{transform:scale(1.03)}
.info{flex:1}
.info h2{font-family:'Playfair Display',serif;font-size:2rem}
.country{color:var(--accent);margin:6px 0 16px}
.info p{color:var(--text-muted);line-height:1.8}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tags span{padding:6px 12px;border-radius:999px;border:1px solid rgba(184,146,88,.35);font-size:.82rem}
.price{text-align:right;width:180px}
.price small{color:#888}
.amount{font-family:'Playfair Display',serif;font-size:2rem;margin:10px 0 18px}
.price a{text-decoration:none;color:var(--accent);font-weight:600}
footer{border-top:1px solid rgba(0,0,0,.06);padding:20px;text-align:center;color:#9ca3af;font-size:.75rem}

@media(max-width:900px){
.card{flex-direction:column;align-items:flex-start}
.card img{width:100%;height:230px}
.price{text-align:left;width:auto}
}
</style>
</head>
<body>

<header>
<div class="nav-left"><a href="explore.html">Explore</a></div>
<div class="logo"><a href="index.html">MaidenWins</a></div>
<div class="nav-right"><a href="contact.html">Contact</a></div>
</header>

<section class="explore-section">
<div class="content">
<h1 class="title">Explore</h1>
<p class="description">Slow mornings or spirited nights — always exceptional.</p>
<div class="divider"></div>
</div>
</section>

<section class="catalog">
<div class="filters">
<div class="filter"><label>Destination</label>
<select id="dest"><option>Africa</option><option>Asia</option></select></div>
<div class="filter"><label>Currency</label>
<select><option selected>INR</option></select></div>
</div>
<div id="cards"></div>
</section>

<footer>© <span id="year"></span> MaidenWins. All rights reserved.</footer>

<script>
const data={
Africa:[
{t:"Safari Adventure",c:"Kenya",p:"₹2,45,000",i:"https://images.unsplash.com/photo-1516426122078-c23e76319801?w=900",d:"Experience luxury safari camps, unforgettable wildlife encounters and breathtaking African sunsets.",tags:["7 Days","Luxury","Wildlife"]},
{t:"Moroccan Escape",c:"Morocco",p:"₹1,95,000",i:"https://images.unsplash.com/photo-1548013146-72479768bada?w=900",d:"Discover ancient medinas, boutique riads and the Sahara in timeless elegance.",tags:["6 Days","Culture","Desert"]}
],
Asia:[
{t:"Bali Retreat",c:"Indonesia",p:"₹1,25,000",i:"https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=900",d:"Luxury villas, rice terraces and secluded beaches.",tags:["5 Days","Beach","Luxury"]},
{t:"Japan Discovery",c:"Japan",p:"₹2,10,000",i:"https://images.unsplash.com/photo-1492571350019-22de08371fd3?w=900",d:"Experience timeless traditions and modern elegance.",tags:["8 Days","Culture","Premium"]}
]};
function render(){
let h="";
data[dest.value].forEach(j=>{
h+=`<div class="card">
<img src="${j.i}">
<div class="info"><h2>${j.t}</h2><div class="country">${j.c}</div><p>${j.d}</p><div class="tags">${j.tags.map(x=>`<span>${x}</span>`).join("")}</div></div>
<div class="price"><small>Starting From</small><div class="amount">${j.p}</div><a href="#">View Journey →</a></div>
</div>`;
});
cards.innerHTML=h;
}
dest.onchange=render;
render();
year.textContent=new Date().getFullYear();
</script>
</body>
</html>
