<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Explore | MaidenWins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f5ef;
      --text-primary: #1f2937;
      --text-muted: #6b7280;
      --accent: #b89258;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left,
        rgba(184,146,88,0.08),
        transparent 35%),
        radial-gradient(circle at bottom right,
        rgba(184,146,88,0.06),
        transparent 30%),
        var(--bg);

      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* ======================
       HEADER
    ====================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      height: 68px;
      padding: 0 6%;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: rgba(248,245,239,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
    }

    .nav-right {
      justify-content: flex-end;
    }

    header a {
      text-decoration: none;
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 400;
      position: relative;
      transition: color 0.3s ease;
    }

    /* Elegant underline */
    header a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0%;
      height: 1.5px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      transition: width 0.35s ease;
    }

    header a:hover {
      color: #111827;
    }

    header a:hover::after {
      width: 100%;
    }

    /* Logo */
    .logo {
      text-align: center;
    }

    .logo a {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #111827;
      text-decoration: none;
    }

    .logo a::after {
      display: none;
    }

    /* ======================
       PAGE CONTENT
    ====================== */

    .explore-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 24px;
      position: relative;
    }

    /* Luxury glow */
    .explore-section::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(184,146,88,0.08);
      border-radius: 50%;
      filter: blur(90px);
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .content {
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 600;
      color: #111827;
      margin-bottom: 20px;
    }

    .divider {
      width: 90px;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      margin: 0 auto 32px;
    }

    .description {
      font-size: 1.12rem;
      line-height: 1.9;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .coming-soon {
      display: inline-block;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* ======================
       FOOTER
    ====================== */

    footer {
      border-top: 1px solid rgba(0,0,0,0.06);
      padding: 26px 8%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .copyright {
      color: #9ca3af;
      font-size: 0.85rem;
    }

    /* ======================
       MOBILE
    ====================== */

    @media (max-width: 768px) {

      header {
        height: 62px;
        padding: 0 20px;
      }

      header a {
        font-size: 0.88rem;
      }

      .logo a {
        font-size: 1.3rem;
      }

      .title {
        font-size: 2.5rem;
      }

      .description {
        font-size: 1rem;
        line-height: 1.8;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="nav-left">
      <a href="explore.html">Explore</a>
    </div>

    <div class="logo">
      <a href="index.html">MaidenWins</a>
    </div>

    <div class="nav-right">
      <a href="contact.html">Contact</a>
    </div>

  </header>

  <!-- CONTENT -->
  <section class="explore-section">

    <div class="content">

      <h1 class="title">
        Explore
      </h1>

      <div class="divider"></div>

      <p class="description">
        A carefully curated collection of journeys,
        experiences, and destinations is being prepared.
        We believe meaningful travel deserves patience,
        intention, and refinement.
      </p>

      <div class="coming-soon">
        Curated journeys coming soon
      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <div class="copyright">
      © <span id="year"></span> MaidenWins. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
