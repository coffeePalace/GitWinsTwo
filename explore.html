<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore | MaidenWins</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#f8f5ef;
 --text:#1f2937;
 --muted:#6b7280;
 --accent:#b89258;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 5%;background:#f8f5ef}
header a{text-decoration:none;color:#555}
.logo{font:600 30px "Playfair Display",serif}
.explore{text-align:center;padding:80px 20px}
.title{font:600 70px "Playfair Display",serif}
.divider,.section-divider{width:90px;height:2px;margin:22px auto;background:linear-gradient(to right,transparent,var(--accent),transparent)}
.description{color:var(--muted);margin-top:25px}
.journeys{width:min(1400px,92%);margin:auto;background:rgba(255,255,255,.3);padding:60px;border-radius:24px}
.section-heading{text-align:center}
.section-heading h2{font:600 46px "Playfair Display",serif}
.filters{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:45px 0}
.filters select{padding:14px 22px;border-radius:999px;border:1px solid var(--accent);background:#fff;min-width:220px}
.card{display:grid;grid-template-columns:340px 1fr 240px;background:#fff;border-radius:18px;overflow:hidden;margin:28px 0;box-shadow:0 10px 35px rgba(0,0,0,.08)}
.card img{width:100%;height:230px;object-fit:cover;transition:.4s}
.card:hover img{transform:scale(1.03)}
.info{padding:38px}
.country{font-size:12px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.info h3{font:600 34px "Playfair Display",serif;margin:8px 0 18px}
.meta{color:#777;margin-bottom:18px}
.info p{line-height:1.8;color:var(--muted)}
.price{background:#faf7f2;display:flex;flex-direction:column;justify-content:center;align-items:center}
.price small{letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.price h4{font:600 42px "Playfair Display",serif;margin:12px 0}
.price span{color:#777}
.price a{margin-top:24px;padding:14px 28px;background:var(--accent);color:#fff;border-radius:999px;text-decoration:none}
@media(max-width:900px){
.card{grid-template-columns:1fr}
.price{padding:30px}
.title{font-size:48px}
.section-heading h2{font-size:34px}
}
</style>
</head>
<body>

<header>
<a href="#">Explore</a>
<div class="logo">MaidenWins</div>
<a href="#">Contact</a>
</header>

<section class="explore">
<div class="title">Explore</div>
<div class="divider"></div>
<p class="description">Extraordinary settings, uncompromising comfort.</p>
</section>

<section class="journeys">

<div class="section-heading">
<h2>Slow mornings or spirited nights<br> — always without equal.</h2>
<div class="section-divider"></div>
</div>

<div class="filters">
<select id="destination">
<option value="All">Discover</option>
<option>Asia</option>
<option>Africa</option>
</select>

<select id="currency">
<option>USD</option>
<option selected>INR</option>
<option>EUR</option>
<option>GBP</option>
<option>AUD</option>
<option>SGD</option>
<option>AED</option>
</select>
</div>

<div id="journeys"></div>

</section>

<script>
const rates={USD:1,INR:83.5,EUR:.86,GBP:.74,AUD:1.53,SGD:1.28,AED:3.67};
const symbols={USD:"$",INR:"₹",EUR:"€",GBP:"£",AUD:"A$",SGD:"S$",AED:"د.إ "};

const data=[
{continent:"Asia",country:"Japan",title:"Majestic Japan",meta:"11 Days • 8 Cities • Luxury",desc:"Discover Tokyo, Kyoto, Osaka and Mount Fuji through carefully curated luxury experiences.",usd:11050,img:"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1200"},
{continent:"Asia",country:"Bali",title:"Bali Retreat",meta:"8 Days • Luxury Villas",desc:"Private villas, temples and beaches.",usd:6200,img:"https://images.unsplash.com/photo-1537953773345-d172ccf13cf1?w=1200"},
{continent:"Africa",country:"Kenya",title:"Kenya Safari",meta:"9 Days • Maasai Mara",desc:"Luxury safari camps and unforgettable wildlife.",usd:9100,img:"https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1200"},
{continent:"Africa",country:"Morocco",title:"Morocco Desert",meta:"10 Days • Marrakech",desc:"Riads, Sahara and private cultural experiences.",usd:7400,img:"https://images.unsplash.com/photo-1548013146-72479768bada?w=1200"}
];

function render(){
const dest=document.getElementById("destination").value;
const cur=document.getElementById("currency").value;
const wrap=document.getElementById("journeys");
wrap.innerHTML="";
data.filter(j=>dest==="All"||j.continent===dest).forEach(j=>{
const price=Math.round(j.usd*rates[cur]).toLocaleString(cur==="INR"?"en-IN":"en-US");
wrap.innerHTML+=`
<div class="card">
<img src="${j.img}">
<div class="info">
<div class="country">${j.country}</div>
<h3>${j.title}</h3>
<div class="meta">${j.meta}</div>
<p>${j.desc}</p>
</div>
<div class="price">
<small>Starting From</small>
<h4>${symbols[cur]}${price}</h4>
<span>Per Couple</span>
<a href="#">View Journey</a>
</div>
</div>`;
});
}
destination.onchange=render;
currency.onchange=render;
render();
</script>

</body>
</html>
