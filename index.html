<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MaidenWins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f5ef;
      --text-primary: #1f2937;
      --text-muted: #6b7280;
      --accent: #b89258;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;

      background:
        radial-gradient(circle at top left,
        rgba(184,146,88,0.08),
        transparent 35%),
        radial-gradient(circle at bottom right,
        rgba(184,146,88,0.06),
        transparent 30%),
        var(--bg);

      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* ======================
       ELEGANT BACKGROUND DOTS
    ====================== */

    .background-dots {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .background-dots span {
      position: absolute;
      border-radius: 50%;
      background: rgba(184,146,88,0.20);
      filter: blur(0.5px);

      animation:
        floatDots ease-in-out infinite alternate,
        pulseDots ease-in-out infinite;
    }

    /* Dot Positions */

    .background-dots span:nth-child(1) {
      width: 12px;
      height: 12px;
      top: 10%;
      left: 8%;
      animation-duration: 15s;
    }

    .background-dots span:nth-child(2) {
      width: 18px;
      height: 18px;
      top: 18%;
      left: 78%;
      animation-duration: 20s;
    }

    .background-dots span:nth-child(3) {
      width: 9px;
      height: 9px;
      top: 34%;
      left: 25%;
      animation-duration: 14s;
    }

    .background-dots span:nth-child(4) {
      width: 14px;
      height: 14px;
      top: 42%;
      left: 88%;
      animation-duration: 22s;
    }

    .background-dots span:nth-child(5) {
      width: 24px;
      height: 24px;
      top: 58%;
      left: 12%;
      animation-duration: 26s;
    }

    .background-dots span:nth-child(6) {
      width: 12px;
      height: 12px;
      top: 66%;
      left: 75%;
      animation-duration: 18s;
    }

    .background-dots span:nth-child(7) {
      width: 8px;
      height: 8px;
      top: 12%;
      left: 55%;
      animation-duration: 16s;
    }

    .background-dots span:nth-child(8) {
      width: 16px;
      height: 16px;
      top: 52%;
      left: 42%;
      animation-duration: 21s;
    }

    .background-dots span:nth-child(9) {
      width: 10px;
      height: 10px;
      top: 78%;
      left: 30%;
      animation-duration: 15s;
    }

    .background-dots span:nth-child(10) {
      width: 20px;
      height: 20px;
      top: 85%;
      left: 86%;
      animation-duration: 24s;
    }

    .background-dots span:nth-child(11) {
      width: 14px;
      height: 14px;
      top: 30%;
      left: 92%;
      animation-duration: 18s;
    }

    .background-dots span:nth-child(12) {
      width: 8px;
      height: 8px;
      top: 48%;
      left: 6%;
      animation-duration: 13s;
    }

    .background-dots span:nth-child(13) {
      width: 22px;
      height: 22px;
      top: 62%;
      left: 60%;
      animation-duration: 27s;
    }

    .background-dots span:nth-child(14) {
      width: 12px;
      height: 12px;
      top: 24%;
      left: 38%;
      animation-duration: 17s;
    }

    .background-dots span:nth-child(15) {
      width: 16px;
      height: 16px;
      top: 90%;
      left: 50%;
      animation-duration: 20s;
    }

    .background-dots span:nth-child(16) {
      width: 9px;
      height: 9px;
      top: 8%;
      left: 90%;
      animation-duration: 14s;
    }

    .background-dots span:nth-child(17) {
      width: 18px;
      height: 18px;
      top: 56%;
      left: 6%;
      animation-duration: 22s;
    }

    .background-dots span:nth-child(18) {
      width: 10px;
      height: 10px;
      top: 74%;
      left: 48%;
      animation-duration: 16s;
    }

    .background-dots span:nth-child(19) {
      width: 14px;
      height: 14px;
      top: 36%;
      left: 68%;
      animation-duration: 19s;
    }

    .background-dots span:nth-child(20) {
      width: 8px;
      height: 8px;
      top: 82%;
      left: 18%;
      animation-duration: 15s;
    }

    @keyframes floatDots {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-24px);
      }
    }

    @keyframes pulseDots {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.65;
        transform: scale(1.12);
      }
    }

    /* ======================
       HEADER
    ====================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      height: 50px;
      padding: 0 5%;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: rgba(248,245,239,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
    }

    .nav-right {
      justify-content: flex-end;
    }

    header a {
      text-decoration: none;
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 400;
      position: relative;
      transition: color 0.3s ease;
    }

    header a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0%;
      height: 1.5px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      transition: width 0.35s ease;
    }

    header a:hover {
      color: #111827;
    }

    header a:hover::after {
      width: 100%;
    }

    .logo {
      text-align: center;
    }

    .logo a {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #111827;
      text-decoration: none;
    }

    .logo a::after {
      display: none;
    }

    /* ======================
       HERO
    ====================== */

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(184,146,88,0.08);
      border-radius: 50%;
      filter: blur(90px);
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 20px;
      color: #111827;
    }

    .divider {
      width: 90px;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      margin: 0 auto 32px;
    }

    .subtitle {
      max-width: 680px;
      margin: auto;
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .location {
      display: inline-block;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* ======================
       FOOTER
    ====================== */

    footer {
      border-top: 1px solid rgba(0,0,0,0.06);
      padding: 20px 5%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .copyright {
      color: #9ca3af;
      font-size: 0.75rem;
    }

    /* ======================
       MOBILE
    ====================== */

    @media (max-width: 768px) {

      header {
        height: 40px;
        padding: 0 10px;
      }

      header a {
        font-size: 0.58rem;
      }

      .logo a {
        font-size: 1.1rem;
      }

      .brand {
        font-size: 3rem;
      }

      .subtitle {
        font-size: 1rem;
        line-height: 1.8;
      }

      .hero {
        padding: 70px 24px;
      }

      .background-dots span {
        transform: scale(0.8);
      }
    }
  </style>
</head>

<body>

  <!-- Elegant Background Dots -->
  <div class="background-dots">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- HEADER -->
  <header>

    <div class="nav-left">
      <a href="explore.html">Explore</a>
    </div>

    <div class="logo">
      <a href="index.html">MaidenWins</a>
    </div>

    <div class="nav-right">
      <a href="contact.html">Contact</a>
    </div>

  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <h1 class="brand">MaidenWins</h1>

      <div class="divider"></div>

      <p class="subtitle">
        Carefully curating journeys worth waiting for —
        refined travel, meaningful experiences,
        and destinations chosen with intention.
      </p>

      <div class="location">
        Based in India
      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <div class="copyright">
      © <span id="year"></span> MaidenWins. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
