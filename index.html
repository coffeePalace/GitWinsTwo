<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MaidenWins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f5ef;
      --text-primary: #1f2937;
      --text-muted: #6b7280;
      --accent: #b89258;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left,
        rgba(184,146,88,0.08),
        transparent 35%),
        radial-gradient(circle at bottom right,
        rgba(184,146,88,0.06),
        transparent 30%),
        var(--bg);

      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* ======================
       LUXURY BACKGROUND
    ====================== */

    .background-scene {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    /* Abstract Partial Globe */
    .globe-wrapper {
      position: absolute;
      right: -220px;
      top: 50%;
      transform: translateY(-50%);
      width: 850px;
      height: 850px;
      opacity: 0.17;
      animation: rotateGlobe 90s linear infinite;
    }

    .globe-svg {
      width: 100%;
      height: 100%;
      filter: blur(0.4px);
    }

    .globe-line {
      fill: none;
      stroke: rgba(184,146,88,0.33);
      stroke-width: 0.9;
    }

    .flight-arc {
      fill: none;
      stroke: rgba(184,146,88,0.16);
      stroke-width: 1.2;
      stroke-dasharray: 6 10;
      animation: arcMove 18s linear infinite;
    }

    /* Aircraft */

    .plane {
      position: absolute;
      width: 28px;
      opacity: 0.12;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .plane svg {
      width: 100%;
      height: auto;
      stroke: rgba(184,146,88,0.65);
      fill: none;
      stroke-width: 1.3;
    }

    .plane-1 {
      top: 26%;
      left: -80px;
      animation: flyOne 42s infinite;
    }

    .plane-2 {
      top: 68%;
      left: -100px;
      opacity: 0.08;
      animation: flyTwo 58s infinite;
    }

    .plane-3 {
      top: 50%;
      left: -90px;
      opacity: 0.06;
      animation: flyThree 72s infinite;
    }

    /* Floating soft glow */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(184,146,88,0.06);
      border-radius: 50%;
      filter: blur(120px);
      top: 15%;
      right: 10%;
      animation: floatGlow 18s ease-in-out infinite;
    }

    @keyframes rotateGlobe {
      from {
        transform: translateY(-50%) rotate(0deg);
      }
      to {
        transform: translateY(-50%) rotate(360deg);
      }
    }

    @keyframes arcMove {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -120;
      }
    }

    @keyframes flyOne {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0;
      }
      15% {
        opacity: 0.12;
      }
      85% {
        opacity: 0.12;
      }
      100% {
        transform: translateX(120vw) translateY(-60px);
        opacity: 0;
      }
    }

    @keyframes flyTwo {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0;
      }
      15% {
        opacity: 0.08;
      }
      85% {
        opacity: 0.08;
      }
      100% {
        transform: translateX(120vw) translateY(50px);
        opacity: 0;
      }
    }

    @keyframes flyThree {
      0% {
        transform: translateX(0) translateY(0);
        opacity: 0;
      }
      10% {
        opacity: 0.06;
      }
      90% {
        opacity: 0.06;
      }
      100% {
        transform: translateX(120vw) translateY(-20px);
        opacity: 0;
      }
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-20px, 25px);
      }
    }

    /* ======================
       HEADER
    ====================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      height: 50px;
      padding: 0 5%;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: rgba(248,245,239,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
    }

    .nav-right {
      justify-content: flex-end;
    }

    header a {
      text-decoration: none;
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 400;
      position: relative;
      transition: color 0.3s ease;
    }

    header a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0%;
      height: 1.5px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      transition: width 0.35s ease;
    }

    header a:hover {
      color: #111827;
    }

    header a:hover::after {
      width: 100%;
    }

    .logo {
      text-align: center;
    }

    .logo a {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #111827;
      text-decoration: none;
    }

    .logo a::after {
      display: none;
    }

    /* ======================
       HERO
    ====================== */

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(184,146,88,0.08);
      border-radius: 50%;
      filter: blur(90px);
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 20px;
      color: #111827;
    }

    .divider {
      width: 90px;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      margin: 0 auto 32px;
    }

    .subtitle {
      max-width: 680px;
      margin: auto;
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .location {
      display: inline-block;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* ======================
       FOOTER
    ====================== */

    footer {
      border-top: 1px solid rgba(0,0,0,0.06);
      padding: 20px 5%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .copyright {
      color: #9ca3af;
      font-size: 0.75rem;
    }

    /* ======================
       MOBILE
    ====================== */

    @media (max-width: 768px) {

      .globe-wrapper {
        width: 520px;
        height: 520px;
        right: -180px;
        opacity: 0.12;
      }

      .plane-3 {
        display: none;
      }

      header {
        height: 40px;
        padding: 0 10px;
      }

      header a {
        font-size: 0.58rem;
      }

      .logo a {
        font-size: 1.1rem;
      }

      .brand {
        font-size: 3rem;
      }

      .subtitle {
        font-size: 1rem;
        line-height: 1.8;
      }

      .hero {
        padding: 70px 24px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND SCENE -->
  <div class="background-scene">

    <div class="ambient-glow"></div>

    <div class="globe-wrapper">
      <svg class="globe-svg" viewBox="0 0 800 800">

        <!-- Partial Globe -->
        <circle class="globe-line" cx="400" cy="400" r="260" />

        <ellipse class="globe-line" cx="400" cy="400" rx="260" ry="120"/>
        <ellipse class="globe-line" cx="400" cy="400" rx="260" ry="180"/>

        <ellipse class="globe-line" cx="400" cy="400" rx="120" ry="260"/>
        <ellipse class="globe-line" cx="400" cy="400" rx="180" ry="260"/>

        <!-- Flight Arcs -->
        <path class="flight-arc"
          d="M190 390 Q400 150 620 420" />

        <path class="flight-arc"
          d="M230 510 Q420 220 590 330" />

      </svg>
    </div>

    <!-- Aircraft -->
    <div class="plane plane-1">
      <svg viewBox="0 0 64 64">
        <path d="M8 34 L56 32 L40 26 L36 12 L30 12 L31 26 L16 24 Z"/>
      </svg>
    </div>

    <div class="plane plane-2">
      <svg viewBox="0 0 64 64">
        <path d="M8 34 L56 32 L40 26 L36 12 L30 12 L31 26 L16 24 Z"/>
      </svg>
    </div>

    <div class="plane plane-3">
      <svg viewBox="0 0 64 64">
        <path d="M8 34 L56 32 L40 26 L36 12 L30 12 L31 26 L16 24 Z"/>
      </svg>
    </div>

  </div>

  <!-- HEADER -->
  <header>

    <div class="nav-left">
      <a href="explore.html">Explore</a>
    </div>

    <div class="logo">
      <a href="index.html">MaidenWins</a>
    </div>

    <div class="nav-right">
      <a href="contact.html">Contact</a>
    </div>

  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <h1 class="brand">MaidenWins</h1>

      <div class="divider"></div>

      <p class="subtitle">
        Carefully curating journeys worth waiting for —
        refined travel, meaningful experiences,
        and destinations chosen with intention.
      </p>

      <div class="location">
        Based in India
      </div>

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <div class="copyright">
      © <span id="year"></span> MaidenWins. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
